packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
saveExact: true
catalog:
  "@ampcode/plugin": 0.0.0-20261122001259-gf675ab0
  "@clanker-stuff/oxlint-config": 0.5.1
  "@effect/platform-node": 4.1.6
  "@effect/tsgo": 0.73.2
  "@effect/vitest": 4.1.6
  "@gjermundgaraba/effect-actions": 0.38.0
  "@types/node": 26.6.6
  effect: 4.1.6
  turbo: 2.11.13
  typescript: 7.0.2
  ultracite: 8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  vitest: 5.1.0
  xstate: 6.0.0-alpha.73

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - effect
  - "@effect/*"
  - "@gjermundgaraba/*"
  - "@clanker-stuff/*"
